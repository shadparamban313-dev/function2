    <form id="form">

    <span>Basic Monthly Salary:</span><input id="month" type="number" placeholder="Enter Monthly Salary"><br><br>
    <span>Total Working Days:</span><input id="working" type="number" placeholder="Enter Total Working Days"><br><br>
    <span>Present Days:</span><input id="present" type="number" placeholder="Enter Present Days"><br><br>
    <span>Overtime Hours:</span><input id="overtime" type="number" placeholder="Enter Overtime Hours"><br><br>
    <button id="submit" type="submit">Add Employee</button>
